name: Keep Koyeb Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployment health check
        env:
          PING_URL: https://vicious-dianna-arya007-e2dd5336.koyeb.app
        run: |
          set -e
          curl --fail --silent --show-error --max-time 20 "$PING_URL/healthz"